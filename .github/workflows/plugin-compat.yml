name: plugin-compat

# Re-check the stable dsh-context-editor plugin against a real dsh-docker image.
#
# The release gate lives in release.yml: every new image is tested (inside the
# freshly built image, with the image's own pnpm) before it is published. This
# workflow is the manual/daily re-check of a published image. It is intentionally
# not triggered by plugin releases: the plugin is expected to stay stable while
# dsh-docker follows upstream DSH.
#
# A failure is reported to 2220545672/dsh-context-editor, where the fix lands:
# the report travels as a repository_dispatch event because a workflow's own
# GITHUB_TOKEN is scoped to its own repository. When CROSS_REPO_TOKEN is not
# configured, the report falls back to an issue here so a red run stays visible.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to test'
        required: false
        default: 'ghcr.io/2220545672/dsh:latest'
      plugin_version:
        description: 'dsh-context-editor version (latest or exact)'
        required: false
        default: 'latest'
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read
  # Only the fallback path (CROSS_REPO_TOKEN missing) writes an issue here.
  issues: write

concurrency:
  group: plugin-compat
  cancel-in-progress: true

jobs:
  compat:
    name: dsh-context-editor inside the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve versions
        id: versions
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          set -euo pipefail
          image="${INPUT_IMAGE:-ghcr.io/2220545672/dsh:latest}"
          plugin_version="${INPUT_PLUGIN_VERSION:-latest}"
          if [[ "${plugin_version}" == "latest" ]]; then
            plugin_version="$(npm view dsh-context-editor version)"
          fi
          [[ "${plugin_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "invalid plugin version: ${plugin_version}" >&2; exit 2; }
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "plugin_version=${plugin_version}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Compatibility target'
            echo ''
            echo "- image: \`${image}\`"
            echo "- dsh-context-editor: \`${plugin_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Pull image
        run: docker pull "${{ steps.versions.outputs.image }}"

      # Only for the failure report: the issue should name both sides, and the
      # DSH version lives inside the image rather than in a manifest readable
      # from here. `|| true` keeps an unreadable version from masking the real
      # failure below.
      - name: Read the DSH version from the image
        id: dsh
        run: |
          set -euo pipefail
          version="$(docker run --rm --entrypoint dsh "${{ steps.versions.outputs.image }}" --version 2>/dev/null || true)"
          echo "version=${version:-unknown}" >> "${GITHUB_OUTPUT}"

      - name: Compatibility smoke inside the image
        run: bash scripts/plugin-compat-image.sh "${{ steps.versions.outputs.image }}" "${{ steps.versions.outputs.plugin_version }}"

      # The issue belongs in the plugin repository (the subject under test). This
      # repository's token cannot write there, so the report is dispatched; the
      # script falls back to a local issue when CROSS_REPO_TOKEN is missing.
      - name: Report the failure to the plugin repository
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          IMAGE: ${{ steps.versions.outputs.image }}
          PLUGIN_VERSION: ${{ steps.versions.outputs.plugin_version }}
          DSH_VERSION: ${{ steps.dsh.outputs.version }}
        run: bash scripts/report-plugin-failure.sh "${PLUGIN_VERSION}" "${DSH_VERSION}" "${IMAGE}"
