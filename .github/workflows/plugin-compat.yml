name: plugin-compat

# Re-check the stable dsh-context-editor plugin against a real dsh-docker image.
#
# The release gate lives in release.yml: every new image is tested (inside the
# freshly built image, with the image's own pnpm) before it is published. This
# workflow is the manual/daily re-check of a published image. It is intentionally
# not triggered by plugin releases: the plugin is expected to stay stable while
# dsh-docker follows upstream DSH.
#
# A failure opens (or comments on) an issue in this repository. The issue step
# uses the workflow's own GITHUB_TOKEN, so no cross-repository token is needed.

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to test'
        required: false
        default: 'ghcr.io/2220545672/dsh:latest'
      plugin_version:
        description: 'dsh-context-editor version (latest or exact)'
        required: false
        default: 'latest'
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: plugin-compat
  cancel-in-progress: true

jobs:
  compat:
    name: dsh-context-editor inside the image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve versions
        id: versions
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          INPUT_PLUGIN_VERSION: ${{ inputs.plugin_version }}
        run: |
          set -euo pipefail
          image="${INPUT_IMAGE:-ghcr.io/2220545672/dsh:latest}"
          plugin_version="${INPUT_PLUGIN_VERSION:-latest}"
          if [[ "${plugin_version}" == "latest" ]]; then
            plugin_version="$(npm view dsh-context-editor version)"
          fi
          [[ "${plugin_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "invalid plugin version: ${plugin_version}" >&2; exit 2; }
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "plugin_version=${plugin_version}" >> "${GITHUB_OUTPUT}"
          {
            echo '### Compatibility target'
            echo ''
            echo "- image: \`${image}\`"
            echo "- dsh-context-editor: \`${plugin_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Pull image
        run: docker pull "${{ steps.versions.outputs.image }}"

      - name: Compatibility smoke inside the image
        run: bash scripts/plugin-compat-image.sh "${{ steps.versions.outputs.image }}" "${{ steps.versions.outputs.plugin_version }}"

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.versions.outputs.image }}
          PLUGIN_VERSION: ${{ steps.versions.outputs.plugin_version }}
        run: |
          set -euo pipefail
          title="[plugin-compat] dsh-context-editor@${PLUGIN_VERSION} in ${IMAGE}"
          body="$(mktemp)"
          cat > "${body}" <<BODY
          The compatibility re-check failed.

          - image: \`${IMAGE}\`
          - plugin: \`dsh-context-editor@${PLUGIN_VERSION}\`
          - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Reproduce locally:

          \`\`\`bash
          bash scripts/plugin-compat-image.sh "${IMAGE}" "${PLUGIN_VERSION}"
          \`\`\`
          BODY
          existing="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search 'plugin-compat in:title' --json number,title \
            | jq -r --arg title "${title}" '.[] | select(.title == $title) | .number' | head -n1)"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" --body-file "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body}"
          fi
